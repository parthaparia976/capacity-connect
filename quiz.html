<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Quiz — Capacity Connect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .page {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
    }

    .back-btn {
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );

      color: white;

      padding: 25px;

      border-radius: 16px;

      margin-bottom: 25px;
    }

    .hero h2 {
      margin-top: 0;
    }

    .quiz-info {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .quiz-card {
      background: white;

      padding: 25px;

      border-radius: 14px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

      margin-bottom: 18px;
    }

    .question-number {
      color: #2563eb;

      font-weight: bold;

      margin-bottom: 8px;
    }

    .question {
      font-size: 19px;

      font-weight: bold;

      margin-bottom: 18px;
    }

    .option {
      display: block;

      border: 1px solid #dbe1ea;

      padding: 13px;

      border-radius: 9px;

      margin: 9px 0;

      cursor: pointer;

      transition: .15s;
    }

    .option:hover {
      background: #f0f5ff;
    }

    .option input {
      margin-right: 10px;
    }

    .submit-btn {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .result {
      display: none;

      background: white;

      padding: 30px;

      border-radius: 14px;

      text-align: center;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
    }

    .score {
      font-size: 42px;

      font-weight: bold;

      color: #2563eb;
    }

    .result-details {
      margin-top: 18px;

      color: #667085;

      line-height: 1.8;
    }

    .passed {
      color: #15803d;

      font-weight: bold;
    }

    .failed {
      color: #dc2626;

      font-weight: bold;
    }

    .result-actions {
      margin-top: 25px;

      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-block;

      text-decoration: none;

      background: #2563eb;

      color: white;

      padding: 11px 18px;

      border-radius: 8px;

      font-weight: 600;
    }

    .secondary-btn {
      background: #475569;
    }

    .loading {
      text-align: center;

      background: white;

      padding: 35px;

      border-radius: 14px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);
    }

    @media (max-width: 650px) {
      .page {
        padding: 18px;
      }

      .header {
        align-items: flex-start;

        flex-direction: column;

        gap: 15px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <div class="header">

      <h1>
        📝 Quiz
      </h1>

      <a
        href="employee.html"
        class="back-btn"
      >
        ← Dashboard
      </a>

    </div>


    <section class="hero">

      <h2>
        Test Your Knowledge
      </h2>

      <p>
        Complete this quiz to check your
        understanding.
      </p>

      <div
        class="quiz-info"
        id="quiz-info"
      >
        Loading your quiz...
      </div>

    </section>


    <div
      id="loading"
      class="loading"
    >
      Preparing your questions...
    </div>


    <form
      id="quiz-form"
      style="display:none;"
    ></form>


    <div
      id="result"
      class="result"
    >

      <h2>
        Quiz Completed 🎉
      </h2>

      <div
        id="score"
        class="score"
      >
        0%
      </div>

      <p
        id="result-message"
      ></p>

      <div
        id="result-details"
        class="result-details"
      ></div>

      <div class="result-actions">

        <a
          href="employee.html"
          class="action-btn"
        >
          Back to Dashboard
        </a>

        <a
          href="learning.html"
          class="action-btn secondary-btn"
        >
          View Learning
        </a>

        <a
          href="certificates.html"
          class="action-btn"
        >
          🏆 View Certificate
        </a>

        <button
          type="button"
          id="retake-btn"
          class="action-btn secondary-btn"
        >
          Take Another Quiz
        </button>

      </div>

    </div>

  </main>


  <script>

    /*
     * ==============================
     * LOGIN CHECK
     * ==============================
     */

    const user = JSON.parse(
      localStorage.getItem(
        "capacityConnectUser"
      ) || "null"
    );


    if (!user || !user.email) {

      window.location.replace(
        "login.html"
      );

      throw new Error(
        "User is not logged in"
      );
    }


    /*
     * ==============================
     * QUESTION BANK
     * ==============================
     *
     * Same topic:
     * Cyber Security / Learning /
     * Capacity Building
     *
     * Every attempt gets 4 questions.
     */

    const questionBank = [

      {
        question:
          "What is a common sign of a phishing email?",

        options: [
          "A routine team update",
          "An urgent request for sensitive information",
          "A normal calendar reminder",
          "A company newsletter"
        ],

        answer: 1
      },

      {
        question:
          "What should you do with a suspicious link?",

        options: [
          "Click it immediately",
          "Forward it to everyone",
          "Verify the source before opening it",
          "Ignore all security warnings"
        ],

        answer: 2
      },

      {
        question:
          "Which password is the strongest?",

        options: [
          "password123",
          "Welcome2026",
          "CompanyName",
          "A long unique password with mixed characters"
        ],

        answer: 3
      },

      {
        question:
          "Why is multi-factor authentication useful?",

        options: [
          "It adds an extra layer of account protection",
          "It removes the need for passwords",
          "It makes phishing impossible",
          "It disables account security"
        ],

        answer: 0
      },

      {
        question:
          "What should you do if you receive a suspicious attachment?",

        options: [
          "Open it to check",
          "Download it to your phone",
          "Verify it before opening",
          "Send it to another employee"
        ],

        answer: 2
      },

      {
        question:
          "What is the safest action after noticing a suspicious email?",

        options: [
          "Reply with your password",
          "Report it using the approved process",
          "Forward it externally",
          "Delete all company emails"
        ],

        answer: 1
      },

      {
        question:
          "Why should sensitive information be protected?",

        options: [
          "To reduce data misuse and security risks",
          "To make files harder to find",
          "To avoid learning",
          "To remove access controls"
        ],

        answer: 0
      },

      {
        question:
          "Which action improves account security?",

        options: [
          "Sharing your password",
          "Using the same password everywhere",
          "Using unique passwords",
          "Writing passwords on public notes"
        ],

        answer: 2
      },

      {
        question:
          "What is social engineering?",

        options: [
          "A software update",
          "A technique that manipulates people into revealing information",
          "A backup process",
          "A password manager"
        ],

        answer: 1
      },

      {
        question:
          "What should you do before entering credentials on a website?",

        options: [
          "Check the website address",
          "Ignore the URL",
          "Disable security tools",
          "Use someone else's account"
        ],

        answer: 0
      },

      {
        question:
          "Why are security updates important?",

        options: [
          "They can address known security weaknesses",
          "They remove all passwords",
          "They stop all internet access",
          "They make accounts public"
        ],

        answer: 0
      },

      {
        question:
          "What should you do if you think your account is compromised?",

        options: [
          "Ignore it",
          "Share the problem publicly",
          "Report it and follow the security procedure",
          "Create a public post"
        ],

        answer: 2
      }
    ];


    /*
     * ==============================
     * DOM
     * ==============================
     */

    const form =
      document.getElementById(
        "quiz-form"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const quizInfo =
      document.getElementById(
        "quiz-info"
      );

    const resultBox =
      document.getElementById(
        "result"
      );

    const resultMessage =
      document.getElementById(
        "result-message"
      );

    const resultDetails =
      document.getElementById(
        "result-details"
      );

    const retakeButton =
      document.getElementById(
        "retake-btn"
      );


    /*
     * ==============================
     * ATTEMPT
     * ==============================
     */

    let attempt =
      Number(
        user.quizAttempts || 0
      );


    /*
     * Keep track of question indexes
     * already used in previous attempts.
     */

    let usedIndexes =
      Array.isArray(
        user.usedQuizQuestions
      )
        ? [...user.usedQuizQuestions]
        : [];


    /*
     * ==============================
     * PICK NEW QUESTIONS
     * ==============================
     */

    function getNextQuestions() {

      /*
       * If the question bank has enough
       * unused questions, use only unused ones.
       */

      let available =
        questionBank
          .map(
            (_, index) => index
          )
          .filter(
            index =>
              !usedIndexes.includes(index)
          );


      /*
       * If all questions have already
       * been used, start a new cycle.
       *
       * This avoids running out of quizzes.
       */

      if (available.length < 4) {

        available =
          questionBank.map(
            (_, index) => index
          );

        usedIndexes = [];
      }


      /*
       * Shuffle available questions.
       */

      available.sort(
        () => Math.random() - 0.5
      );


      const selected =
        available.slice(0, 4);


      /*
       * Remember these questions.
       */

      usedIndexes =
        [
          ...usedIndexes,
          ...selected
        ];


      return selected;
    }


    /*
     * ==============================
     * RENDER QUIZ
     * ==============================
     */

    function renderQuiz() {

      const selectedIndexes =
        getNextQuestions();


      quizInfo.textContent =
        `Attempt ${attempt + 1} · 4 questions · Passing mark 70%`;


      form.innerHTML = "";


      selectedIndexes.forEach(
        (questionIndex, position) => {

          const question =
            questionBank[
              questionIndex
            ];


          const card =
            document.createElement(
              "div"
            );

          card.className =
            "quiz-card";


          card.innerHTML = `

            <div class="question-number">
              Question ${position + 1}
            </div>

            <div class="question">
              ${question.question}
            </div>

            ${question.options
              .map(
                (option, optionIndex) => `
                  <label class="option">

                    <input
                      type="radio"
                      name="q${position}"
                      value="${optionIndex}"
                    >

                    ${option}

                  </label>
                `
              )
              .join("")}

          `;


          /*
           * Store the real bank question
           * index on the card.
           */

          card.dataset.questionIndex =
            questionIndex;


          form.appendChild(
            card
          );
        }
      );


      const submitButton =
        document.createElement(
          "button"
        );

      submitButton.type =
        "submit";

      submitButton.className =
        "submit-btn";

      submitButton.textContent =
        "Submit Quiz";


      form.appendChild(
        submitButton
      );


      loading.style.display =
        "none";

      form.style.display =
        "block";
    }


    /*
     * ==============================
     * SUBMIT QUIZ
     * ==============================
     */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const cards =
          form.querySelectorAll(
            ".quiz-card"
          );


        /*
         * Make sure all questions
         * are answered.
         */

        let allAnswered = true;


        cards.forEach(
          (card, index) => {

            const selected =
              card.querySelector(
                `input[name="q${index}"]:checked`
              );


            if (!selected) {
              allAnswered = false;
            }

          }
        );


        if (!allAnswered) {

          alert(
            "Please answer all 4 questions before submitting."
          );

          return;
        }


        /*
         * Calculate score.
         */

        let correct = 0;


        cards.forEach(
          (card, index) => {

            const questionIndex =
              Number(
                card.dataset.questionIndex
              );


            const question =
              questionBank[
                questionIndex
              ];


            const selected =
              card.querySelector(
                `input[name="q${index}"]:checked`
              );


            if (
              selected &&
              Number(selected.value) ===
                question.answer
            ) {

              correct++;
            }

          }
        );


        const score =
          Math.round(
            (correct / 4) * 100
          );


        /*
         * Attempt number.
         */

        const newAttempt =
          attempt + 1;


        /*
         * Progress:
         *
         * Attempt 1 -> 20%
         * Attempt 2 -> 40%
         * Attempt 3 -> 60%
         * Attempt 4 -> 80%
         * Attempt 5 -> 100%
         *
         * We never reduce progress.
         */

        const calculatedProgress =
          Math.min(
            100,
            newAttempt * 20
          );


        const oldProgress =
          Number(
            user.learningProgress || 0
          );


        const newProgress =
          Math.max(
            oldProgress,
            calculatedProgress
          );


        /*
         * Save in localStorage.
         */

        const previousScores =
          Array.isArray(user.quizScores)
            ? user.quizScores
            : [];

        const updatedScores = [
          ...previousScores,
          score
        ];

        const averageQuizScore =
          Math.round(
            updatedScores.reduce(
              (sum, item) =>
                sum + Number(item || 0),
              0
            ) / updatedScores.length
          );

        const updatedUser = {

          ...user,

          quizScore:
            score,

          quizScores:
            updatedScores,

          quizAverage:
            averageQuizScore,

          quizAttempts:
            newAttempt,

          learningProgress:
            newProgress,

          usedQuizQuestions:
            usedIndexes

        };


        localStorage.setItem(
          "capacityConnectUser",
          JSON.stringify(
            updatedUser
          )
        );


        /*
         * Update current variables.
         */

        attempt =
          newAttempt;

        user.quizAttempts =
          newAttempt;

        user.quizScore =
          score;

        user.quizScores =
          updatedScores;

        user.quizAverage =
          averageQuizScore;

        user.learningProgress =
          newProgress;

        user.usedQuizQuestions =
          usedIndexes;


        /*
         * Save result to backend.
         *
         * Course count is NOT touched.
         */

        try {

          const response =
            await fetch(
              "/api/quiz-results",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  email:
                    user.email,

                  score:
                    score,

                  progress:
                    newProgress,

                  attemptOnly:
                    true

                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            console.error(
              "Quiz API error:",
              data
            );

          }

        } catch (error) {

          console.error(
            "Could not save quiz result:",
            error
          );

        }


        /*
         * Show result.
         */

        form.style.display =
          "none";

        resultBox.style.display =
          "block";


        document.getElementById(
          "score"
        ).textContent =
          score + "%";


        if (score >= 70) {

          resultMessage.textContent =
            "Congratulations! You passed the quiz.";

          resultMessage.className =
            "passed";

        } else {

          resultMessage.textContent =
            "You did not reach the passing mark. Keep learning and try again.";

          resultMessage.className =
            "failed";
        }


        resultDetails.innerHTML = `

          <div>
            <strong>
              Quiz Attempt:
            </strong>

            ${newAttempt}
          </div>

          <div>
            <strong>
              Learning Progress:
            </strong>

            ${newProgress}%
          </div>

          <div>
            <strong>
              Courses Enrolled:
            </strong>

            0
          </div>

        `;

      }
    );


    /*
     * ==============================
     * RETAKE
     * ==============================
     */

    retakeButton.addEventListener(
      "click",
      function() {

        resultBox.style.display =
          "none";

        form.innerHTML =
          "";

        renderQuiz();

      }
    );


    /*
     * START
     */

    renderQuiz();

  </script>

</body>

</html>
