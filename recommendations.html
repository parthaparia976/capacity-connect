<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Recommendations - Capacity Connect
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 40px 25px;
    }

    .header {
      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      color: white;

      padding: 35px;

      border-radius: 20px;

      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .back {
      display: inline-block;

      margin-bottom: 20px;

      color: #4f46e5;

      text-decoration: none;

      font-weight: bold;
    }

    .section-title {
      margin: 30px 0 18px;

      font-size: 24px;
    }

    .cards {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(250px, 1fr)
        );

      gap: 20px;
    }

    .card {
      background: white;

      padding: 25px;

      border-radius: 16px;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 35px;

      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #6b7280;

      line-height: 1.5;

      margin-bottom: 18px;
    }

    .progress {
      height: 8px;

      background: #e5e7eb;

      border-radius: 10px;

      overflow: hidden;

      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;

      width: 0%;

      background: #6366f1;

      border-radius: 10px;

      transition:
        width 0.3s ease;
    }

    .btn {
      display: inline-block;

      margin-top: 12px;

      padding: 10px 18px;

      background: #4f46e5;

      color: white;

      text-decoration: none;

      border-radius: 8px;
    }

    .ai-box {
      background: white;

      padding: 25px;

      border-radius: 16px;

      margin-top: 30px;

      border-left:
        5px solid #7c3aed;
    }

    .ai-box h2 {
      margin-bottom: 10px;
    }

    .ai-box p {
      color: #6b7280;

      line-height: 1.6;
    }

    .empty-card {
      background: white;

      padding: 35px;

      border-radius: 16px;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,0.08);

      text-align: center;

      grid-column: 1 / -1;
    }

    .empty-card .icon {
      font-size: 42px;
    }

    .empty-card h3 {
      margin-bottom: 10px;
    }

    .empty-card p {
      color: #6b7280;

      line-height: 1.6;
    }

    @media (max-width: 600px) {

      .page {
        padding: 25px 15px;
      }

      .header h1 {
        font-size: 27px;
      }

    }

  </style>

</head>


<body>

  <div class="page">


    <!-- BACK -->

    <a
      href="employee.html"
      class="back"
    >
      ← Back to Dashboard
    </a>


    <!-- HEADER -->

    <div class="header">

      <h1>
        💡 Learning Recommendations
      </h1>

      <p>
        Personalized learning suggestions
        based on your learning progress.
      </p>

    </div>


    <!-- TITLE -->

    <h2 class="section-title">
      Recommended for You
    </h2>


    <!-- DYNAMIC CARDS -->

    <div
      class="cards"
      id="recommendation-cards"
    ></div>


    <!-- SMART RECOMMENDATION -->

    <div
      class="ai-box"
      id="recommendation-message"
    >

      <h2>
        🤖 Smart Recommendation
      </h2>

      <p>
        Complete your first quiz to unlock
        personalized learning recommendations.
      </p>

    </div>


  </div>


  <script>

    /*
     * Get logged-in user
     */

    const user = JSON.parse(
      localStorage.getItem(
        "capacityConnectUser"
      ) || "null"
    );


    /*
     * Login check
     */

    if (!user || !user.email) {

      window.location.replace(
        "login.html"
      );

      throw new Error(
        "User is not logged in"
      );
    }


    /*
     * Elements
     */

    const cardsContainer =
      document.getElementById(
        "recommendation-cards"
      );


    const message =
      document.getElementById(
        "recommendation-message"
      );


    /*
     * User learning data
     */

    const quizAttempts =
      Number(
        user.quizAttempts || 0
      );


    const quizScore =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            user.quizScore || 0
          )
        )
      );


    const learningProgress =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            user.learningProgress || 0
          )
        )
      );


    /*
     * NEW USER
     *
     * No quiz attempt yet.
     */

    if (quizAttempts === 0) {

      cardsContainer.innerHTML = `

        <div class="empty-card">

          <div class="icon">
            📝
          </div>

          <h3>
            No recommendations yet
          </h3>

          <p>
            Complete your first quiz to begin
            your personalized learning journey.
          </p>

        </div>

      `;


      message.innerHTML = `

        <h2>
          🤖 Smart Recommendation
        </h2>

        <p>
          No assessment data is available yet.
          Complete a quiz and your recommendations
          will update automatically.
        </p>

      `;


    } else {


      /*
       * QUIZ COMPLETED
       *
       * Show recommendation cards.
       */

      cardsContainer.innerHTML = `

        <!-- PROJECT MANAGEMENT -->

        <div class="card">

          <div class="icon">
            📋
          </div>

          <h3>
            Project Management
          </h3>

          <p>
            Improve project planning,
            task management, scheduling
            and execution skills.
          </p>

          <div class="progress">

            <div
              class="progress-bar"
              style="
                width:${learningProgress}%
              "
            ></div>

          </div>

          <small>
            Current competency:
            ${learningProgress}%
          </small>

          <br>

          <a
            href="learning.html"
            class="btn"
          >
            Continue Learning
          </a>

        </div>


        <!-- LEADERSHIP -->

        <div class="card">

          <div class="icon">
            👥
          </div>

          <h3>
            Leadership Skills
          </h3>

          <p>
            Develop leadership,
            decision-making and team
            management abilities.
          </p>

          <div class="progress">

            <div
              class="progress-bar"
              style="
                width:${learningProgress}%
              "
            ></div>

          </div>

          <small>
            Current competency:
            ${learningProgress}%
          </small>

          <br>

          <a
            href="learning.html"
            class="btn"
          >
            Continue Learning
          </a>

        </div>


        <!-- PROBLEM SOLVING -->

        <div class="card">

          <div class="icon">
            🧩
          </div>

          <h3>
            Problem Solving
          </h3>

          <p>
            Strengthen analytical thinking
            and practical problem-solving
            skills.
          </p>

          <div class="progress">

            <div
              class="progress-bar"
              style="
                width:${learningProgress}%
              "
            ></div>

          </div>

          <small>
            Current competency:
            ${learningProgress}%
          </small>

          <br>

          <a
            href="learning.html"
            class="btn"
          >
            Continue Learning
          </a>

        </div>

      `;


      /*
       * SMART RECOMMENDATION
       */

      message.innerHTML = `

        <h2>
          🤖 Smart Recommendation
        </h2>

        <p>
          Your latest quiz score is
          <strong>
            ${quizScore}%
          </strong>.

          Your current learning progress is
          <strong>
            ${learningProgress}%
          </strong>.

          Continue learning to improve
          your skills.
        </p>

      `;

    }

  </script>

</body>

</html>
