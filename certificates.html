<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Certificates - Capacity Connect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background: #eef2f1;
      color: #172b34;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 22px 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .topbar-left h1 {
      margin: 0;
      font-size: 30px;
    }

    .topbar-left p {
      margin-top: 7px;
      color: #667085;
    }

    .back-btn,
    .print-btn {
      border: 0;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-btn {
      background: #102027;
      color: #fff;
    }

    .print-btn {
      background: #079455;
      color: #fff;
    }

    .empty {
      background: #fff;
      border: 1px solid #dfe7e3;
      border-radius: 20px;
      padding: 65px 30px;
      text-align: center;
      box-shadow:
        0 12px 35px rgba(16, 32, 39, .07);
    }

    .empty-icon {
      font-size: 54px;
      margin-bottom: 18px;
    }

    .empty h2 {
      margin-bottom: 10px;
      font-size: 25px;
    }

    .empty p {
      max-width: 560px;
      margin: 0 auto;
      color: #667085;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    /*
     * PROFESSIONAL CERTIFICATE
     */

    .certificate {
      position: relative;
      background: #fff;
      border: 1px solid #d6e0db;
      border-radius: 20px;
      padding: 58px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(16, 32, 39, .10);
    }

    .certificate::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid #079455;
      border-radius: 14px;
      pointer-events: none;
    }

    .certificate::after {
      content: "";
      position: absolute;
      inset: 24px;
      border: 1px solid #cad7d1;
      border-radius: 10px;
      pointer-events: none;
    }

    .certificate-inner {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .brand-mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #079455;
      color: #fff;
      border-radius: 17px;
      font-size: 29px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #102027;
    }

    .brand-subtitle {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #7a8985;
      text-transform: uppercase;
    }

    .certificate-label {
      margin-top: 42px;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 900;
      color: #079455;
      text-transform: uppercase;
    }

    .certificate-title {
      margin-top: 12px;
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: 49px;
      letter-spacing: 1px;
      color: #172b34;
    }

    .divider {
      width: 92px;
      height: 2px;
      margin: 19px auto 26px;
      background: #079455;
    }

    .presented {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #71817d;
      text-transform: uppercase;
    }

    .learner-name {
      margin-top: 12px;
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      font-size: 42px;
      color: #102027;
    }

    .description {
      max-width: 690px;
      margin: 14px auto 0;
      color: #596a66;
      font-size: 15px;
      line-height: 1.75;
    }

    .quiz-name {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 800;
      color: #079455;
    }

    .score-box {
      width: fit-content;
      min-width: 210px;
      margin: 31px auto 24px;
      padding: 18px 32px;
      background: #effaf4;
      border: 1px solid #c7ead8;
      border-radius: 14px;
    }

    .score-label {
      display: block;
      margin-bottom: 7px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #6a7b76;
      text-transform: uppercase;
    }

    .score {
      font-size: 37px;
      font-weight: 900;
      color: #079455;
    }

    .details {
      max-width: 820px;
      margin: 27px auto 0;
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 17px;
    }

    .detail {
      padding: 15px 12px;
      border-top: 1px solid #dfe7e3;
    }

    .detail-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #7a8985;
      text-transform: uppercase;
    }

    .detail-value {
      margin-top: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #172b34;
      word-break: break-word;
    }

    .seal {
      width: 94px;
      height: 94px;
      margin: 30px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px double #079455;
      border-radius: 50%;
      background: #f8fffb;
      color: #079455;
      font-size: 31px;
      font-weight: 900;
    }

    .issued {
      margin-top: 26px;
      color: #81908b;
      font-size: 11px;
      letter-spacing: .7px;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    @media (max-width: 720px) {
      .page {
        padding: 18px 12px 35px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .certificate {
        padding: 42px 23px;
      }

      .certificate-title {
        font-size: 36px;
      }

      .learner-name {
        font-size: 31px;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .page {
        max-width: none;
        padding: 0;
      }

      .topbar,
      .toolbar,
      .actions {
        display: none !important;
      }

      .certificate {
        min-height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 48px;
      }

      .certificate::before {
        inset: 10px;
      }

      .certificate::after {
        inset: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="topbar">

      <div class="topbar-left">
        <h1>🏆 My Certificates</h1>

        <p>
          Your learning achievements and certificates.
        </p>
      </div>

      <a
        href="employee.html"
        class="back-btn"
      >
        ← Dashboard
      </a>

    </div>


    <div id="certificates-container"></div>

  </main>


  <script>

    const user = JSON.parse(
      localStorage.getItem(
        "capacityConnectUser"
      ) || "null"
    );

    if (!user || !user.email) {

      window.location.replace(
        "login.html"
      );

      throw new Error(
        "User is not logged in"
      );
    }


    const container =
      document.getElementById(
        "certificates-container"
      );


    const quizAttempts =
      Number(
        user.quizAttempts || 0
      );


    const quizScore =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            user.quizScore || 0
          )
        )
      );


    /*
     * New user:
     * no quiz = no certificate.
     */

    if (quizAttempts < 1) {

      container.innerHTML = `

        <section class="empty">

          <div class="empty-icon">
            🎓
          </div>

          <h2>
            No certificate yet
          </h2>

          <p>
            Complete your first quiz to
            generate your Capacity Connect
            certificate automatically.
          </p>

        </section>

      `;

    } else {

      /*
       * One certificate ID per browser/user.
       */

      let certificateId =
        localStorage.getItem(
          "capacityConnectCertificateId"
        );


      if (!certificateId) {

        const randomPart =
          Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


        certificateId =
          "CC-" +
          Date.now()
            .toString(36)
            .toUpperCase() +
          "-" +
          randomPart;


        localStorage.setItem(
          "capacityConnectCertificateId",
          certificateId
        );
      }


      /*
       * Automatic completion date.
       */

      const completionDate =
        new Date().toLocaleDateString(
          "en-GB",
          {
            day: "2-digit",
            month: "long",
            year: "numeric"
          }
        );


      const learnerName =
        user.name ||
        "Learner";


      /*
       * Professional certificate.
       */

      container.innerHTML = `

        <div class="toolbar">

          <button
            class="print-btn"
            onclick="window.print()"
          >
            Print / Save as PDF
          </button>

        </div>


        <section class="certificate">

          <div class="certificate-inner">


            <div class="brand-mark">
              C
            </div>


            <div class="brand-name">
              CAPACITY CONNECT
            </div>


            <div class="brand-subtitle">
              Learning & Development
            </div>


            <div class="certificate-label">
              Certificate of Completion
            </div>


            <h2 class="certificate-title">
              CERTIFICATE
            </h2>


            <div class="divider"></div>


            <div class="presented">
              This certificate is proudly presented to
            </div>


            <div class="learner-name">
              ${learnerName}
            </div>


            <p class="description">

              In recognition of completing the
              Capacity Connect learning assessment
              and participating in the organization's
              professional learning journey.

            </p>


            <div class="quiz-name">
              Cyber Security Awareness Quiz
            </div>


            <div class="score-box">

              <span class="score-label">
                Assessment Score
              </span>

              <span class="score">
                ${quizScore}%
              </span>

            </div>


            <div class="details">


              <div class="detail">

                <div class="detail-label">
                  Completion Date
                </div>

                <div class="detail-value">
                  ${completionDate}
                </div>

              </div>


              <div class="detail">

                <div class="detail-label">
                  Quiz Attempts
                </div>

                <div class="detail-value">
                  ${quizAttempts}
                </div>

              </div>


              <div class="detail">

                <div class="detail-label">
                  Certificate ID
                </div>

                <div class="detail-value">
                  ${certificateId}
                </div>

              </div>


            </div>


            <div class="seal">
              ✓
            </div>


            <div class="issued">
              Issued electronically by Capacity Connect
            </div>


          </div>

        </section>


        <div class="actions">

          <button
            class="print-btn"
            onclick="window.print()"
          >
            🏆 Download / Save Certificate
          </button>

        </div>

      `;
    }

  </script>

</body>
</html>
